name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-theme/**'
      - 'passes/*/README.md'
      - 'xpasses/*/README.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

# Allow one deploy at a time, and let a newer push supersede a queued one
# rather than publishing an older commit after it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # --strict turns broken internal links and unresolved anchors into build
      # failures, which is the only automated check the prose gets.
      - run: mkdocs build --strict
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
